<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diário de Implantação</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f11;
    --surface: #17171b;
    --surface2: #1f1f26;
    --border: #2a2a35;
    --accent: #c8f135;
    --accent2: #f1c835;
    --accent3: #35c8f1;
    --text: #e8e8f0;
    --text-muted: #6b6b80;
    --danger: #f13560;
    --warning: #f1a035;
    --success: #35f188;
    --radius: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 32px 24px;
  }

  /* HEADER */
  header {
    max-width: 960px;
    margin: 0 auto 40px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .header-left h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2.4rem;
    line-height: 1.1;
    color: var(--text);
  }

  .header-left h1 span { color: var(--accent); font-style: italic; }

  .header-left p {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-top: 6px;
    font-family: 'DM Mono', monospace;
  }

  #hoje { color: var(--accent3); }

  .btn-novo {
    background: var(--accent);
    color: #0f0f11;
    border: none;
    border-radius: var(--radius);
    padding: 10px 20px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    white-space: nowrap;
  }

  .btn-novo:hover { transform: translateY(-2px); box-shadow: 0 6px 24px #c8f13540; }

  .btn-excel {
    background: transparent;
    color: var(--success);
    border: 1px solid var(--success);
    border-radius: var(--radius);
    padding: 9px 18px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: transform .15s, background .15s, box-shadow .15s;
    white-space: nowrap;
  }

  .btn-excel:hover { background: #35f18815; transform: translateY(-2px); box-shadow: 0 6px 24px #35f18830; }

  .header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  /* STATS BAR */
  .stats-bar {
    max-width: 960px;
    margin: 0 auto 32px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    position: relative;
    overflow: hidden;
  }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }

  .stat-card.total::before { background: var(--accent3); }
  .stat-card.pendente::before { background: var(--danger); }
  .stat-card.andamento::before { background: var(--warning); }
  .stat-card.concluido::before { background: var(--success); }

  .stat-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--text-muted);
    font-family: 'DM Mono', monospace;
  }

  .stat-num {
    font-family: 'DM Serif Display', serif;
    font-size: 2.2rem;
    line-height: 1.1;
    margin-top: 4px;
  }

  .stat-card.total .stat-num { color: var(--accent3); }
  .stat-card.pendente .stat-num { color: var(--danger); }
  .stat-card.andamento .stat-num { color: var(--warning); }
  .stat-card.concluido .stat-num { color: var(--success); }

  /* FILTERS */
  .filters {
    max-width: 960px;
    margin: 0 auto 20px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text-muted);
    font-size: 0.82rem;
    padding: 6px 16px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all .15s;
  }

  .filter-btn:hover, .filter-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: #c8f1350f;
  }

  .search-box {
    margin-left: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 16px;
    color: var(--text);
    font-size: 0.82rem;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    width: 220px;
    transition: border-color .15s;
  }

  .search-box:focus { border-color: var(--accent3); }
  .search-box::placeholder { color: var(--text-muted); }

  /* ITEMS LIST */
  .list {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: start;
    transition: border-color .15s, transform .15s;
    animation: slideIn .3s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .item:hover { border-color: #3a3a48; transform: translateX(2px); }

  .item-left { display: flex; flex-direction: column; gap: 6px; }

  .item-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .item-titulo {
    font-weight: 500;
    font-size: 0.95rem;
    flex: 1;
    min-width: 200px;
  }

  .item-titulo.done { text-decoration: line-through; color: var(--text-muted); }

  .badge {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    padding: 3px 10px;
    border-radius: 12px;
    font-weight: 500;
    white-space: nowrap;
  }

  .badge-pendente   { background: #f1356015; color: var(--danger); border: 1px solid #f1356030; }
  .badge-andamento  { background: #f1a03515; color: var(--warning); border: 1px solid #f1a03530; }
  .badge-concluido  { background: #35f18815; color: var(--success); border: 1px solid #35f18830; }
  .badge-bloqueado  { background: #9935f115; color: #c09af0; border: 1px solid #9935f130; }

  .badge-cat {
    font-size: 0.68rem;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--surface2);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  .item-desc {
    font-size: 0.83rem;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .item-meta {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
  }

  .meta-info {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .meta-info span { color: var(--text); }

  /* UPDATES */
  .updates-list {
    margin-top: 8px;
    border-left: 2px solid var(--border);
    padding-left: 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .update-entry {
    font-size: 0.78rem;
    color: var(--text-muted);
    line-height: 1.4;
  }

  .update-entry .u-date {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    color: var(--accent3);
    margin-right: 6px;
  }

  .toggle-updates {
    font-size: 0.72rem;
    color: var(--accent3);
    cursor: pointer;
    background: none;
    border: none;
    font-family: 'DM Mono', monospace;
    padding: 0;
    margin-top: 4px;
  }

  .toggle-updates:hover { text-decoration: underline; }

  /* ITEM ACTIONS */
  .item-right { display: flex; gap: 8px; align-items: flex-start; }

  .action-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    padding: 5px 8px;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
    font-family: 'DM Sans', sans-serif;
  }

  .action-btn:hover { background: var(--border); color: var(--text); }
  .action-btn.danger:hover { border-color: var(--danger); color: var(--danger); }

  /* PROGRESS BAR */
  .progress-wrap {
    max-width: 960px;
    margin: 0 auto 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .progress-label {
    font-size: 0.78rem;
    color: var(--text-muted);
    font-family: 'DM Mono', monospace;
    white-space: nowrap;
  }

  .progress-bar-bg {
    flex: 1;
    height: 8px;
    background: var(--surface2);
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent3), var(--accent));
    border-radius: 4px;
    transition: width .5s ease;
  }

  .progress-pct {
    font-family: 'DM Serif Display', serif;
    font-size: 1.1rem;
    color: var(--accent);
    white-space: nowrap;
    min-width: 42px;
    text-align: right;
  }

  /* MODAL */
  .modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: #0008;
    backdrop-filter: blur(4px);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-bg.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    width: 100%;
    max-width: 520px;
    animation: popIn .2s ease;
  }

  @keyframes popIn {
    from { transform: scale(.94); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .modal h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.5rem;
    margin-bottom: 20px;
    color: var(--text);
  }

  .form-group { margin-bottom: 16px; }

  .form-label {
    display: block;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--text-muted);
    font-family: 'DM Mono', monospace;
    margin-bottom: 6px;
  }

  .form-input, .form-select, .form-textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 14px;
    font-size: 0.88rem;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: border-color .15s;
  }

  .form-input:focus, .form-select:focus, .form-textarea:focus {
    border-color: var(--accent3);
  }

  .form-select option { background: var(--surface); }
  .form-textarea { resize: vertical; min-height: 80px; }

  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

  .btn-cancel {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-muted);
    padding: 9px 20px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    cursor: pointer;
  }

  .btn-save {
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #0f0f11;
    padding: 9px 22px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 0.88rem;
    cursor: pointer;
    transition: opacity .15s;
  }

  .btn-save:hover { opacity: .85; }

  /* UPDATE MODAL */
  .update-modal-body { font-size: 0.88rem; }

  .empty {
    max-width: 960px;
    margin: 40px auto;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.9rem;
    padding: 48px;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }

  .empty strong { display: block; font-family: 'DM Serif Display', serif; font-size: 1.4rem; color: var(--text); margin-bottom: 8px; }

  /* Responsive */
  @media (max-width: 600px) {
    .stats-bar { grid-template-columns: repeat(2, 1fr); }
    .search-box { width: 100%; margin-left: 0; }
    header { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Diário de <span>Implantação</span></h1>
    <p>Acompanhamento de pendências · <span id="hoje"></span></p>
  </div>
  <div class="header-actions">
    <button class="btn-excel" onclick="exportarExcel()">⬇ Exportar Excel</button>
    <button class="btn-novo" onclick="abrirModal()">+ Nova Pendência</button>
  </div>
</header>

<div class="progress-wrap">
  <span class="progress-label">Progresso geral</span>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
  </div>
  <span class="progress-pct" id="progressPct">0%</span>
</div>

<div class="stats-bar">
  <div class="stat-card total">
    <div class="stat-label">Total</div>
    <div class="stat-num" id="st-total">0</div>
  </div>
  <div class="stat-card pendente">
    <div class="stat-label">Pendente</div>
    <div class="stat-num" id="st-pend">0</div>
  </div>
  <div class="stat-card andamento">
    <div class="stat-label">Em Andamento</div>
    <div class="stat-num" id="st-and">0</div>
  </div>
  <div class="stat-card concluido">
    <div class="stat-label">Concluído</div>
    <div class="stat-num" id="st-conc">0</div>
  </div>
</div>

<div class="filters">
  <button class="filter-btn active" data-filter="todos" onclick="setFiltro(this,'todos')">Todos</button>
  <button class="filter-btn" data-filter="pendente" onclick="setFiltro(this,'pendente')">Pendentes</button>
  <button class="filter-btn" data-filter="andamento" onclick="setFiltro(this,'andamento')">Em andamento</button>
  <button class="filter-btn" data-filter="bloqueado" onclick="setFiltro(this,'bloqueado')">Bloqueados</button>
  <button class="filter-btn" data-filter="concluido" onclick="setFiltro(this,'concluido')">Concluídos</button>
  <input class="search-box" type="text" placeholder="🔍  Pesquisar..." oninput="renderLista()" id="searchInput">
</div>

<div class="list" id="lista"></div>

<!-- MODAL NOVA/EDITAR PENDÊNCIA -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2 id="modalTitulo">Nova Pendência</h2>
    <div class="form-group">
      <label class="form-label">Título *</label>
      <input class="form-input" id="fTitulo" placeholder="Ex: Configuração de ponto eletrônico">
    </div>
    <div class="form-group">
      <label class="form-label">Descrição</label>
      <textarea class="form-textarea" id="fDesc" placeholder="Descreva a pendência, o que está aguardando, área responsável..."></textarea>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-select" id="fStatus">
          <option value="pendente">Pendente</option>
          <option value="andamento">Em andamento</option>
          <option value="bloqueado">Bloqueado</option>
          <option value="concluido">Concluído</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Categoria</label>
        <input class="form-input" id="fCat" placeholder="Ex: RH, TI, Infra...">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Responsável / Área aguardada</label>
      <input class="form-input" id="fResp" placeholder="Ex: Equipe de TI, RH Central...">
    </div>
    <div class="form-group">
      <label class="form-label">Previsão</label>
      <input class="form-input" id="fPrevisao" type="date">
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn-save" onclick="salvar()">Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL ATUALIZAÇÃO -->
<div class="modal-bg" id="updateModalBg">
  <div class="modal">
    <h2>Adicionar Atualização</h2>
    <div class="update-modal-body">
      <div class="form-group">
        <label class="form-label">Nota de atualização</label>
        <textarea class="form-textarea" id="fUpdate" placeholder="Descreva o que foi feito, nova informação recebida, mudança de status..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Novo status (opcional)</label>
        <select class="form-select" id="fUpdateStatus">
          <option value="">Manter status atual</option>
          <option value="pendente">Pendente</option>
          <option value="andamento">Em andamento</option>
          <option value="bloqueado">Bloqueado</option>
          <option value="concluido">Concluído</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="fecharUpdateModal()">Cancelar</button>
      <button class="btn-save" onclick="salvarUpdate()">Registrar</button>
    </div>
  </div>
</div>

<script>
// ── STATE ────────────────────────────────────────────────────
const STORAGE_KEY = 'diario-implantacao-v1';
let items = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let filtroAtivo = 'todos';
let editandoId = null;
let updateTargetId = null;

// Pré-popular com exemplos se vazio
if (items.length === 0) {
  const hoje = new Date().toISOString().split('T')[0];
  items = [
    {
      id: uid(), titulo: 'Implantação do ponto eletrônico',
      desc: 'Colaboradores ainda não iniciaram a marcação de ponto. Aguardando liberação do sistema pela TI.',
      status: 'pendente', categoria: 'RH', responsavel: 'TI Central',
      previsao: '', criadoEm: hoje,
      updates: [{ data: hoje, texto: 'Pendência registrada. TI informou que o sistema está em configuração.' }]
    },
    {
      id: uid(), titulo: 'Criação de indicadores do departamento',
      desc: 'Definição de KPIs e dashboard de acompanhamento ainda não foi iniciada.',
      status: 'andamento', categoria: 'Gestão', responsavel: 'Controladoria',
      previsao: '', criadoEm: hoje,
      updates: [{ data: hoje, texto: 'Reunião agendada com a controladoria para alinhamento dos indicadores.' }]
    },
    {
      id: uid(), titulo: 'Cadastro de colaboradores no sistema',
      desc: 'Novos colaboradores precisam ser cadastrados no sistema de RH.',
      status: 'concluido', categoria: 'RH', responsavel: 'RH',
      previsao: '', criadoEm: hoje,
      updates: [{ data: hoje, texto: 'Concluído! Todos os colaboradores foram cadastrados.' }]
    }
  ];
  salvarStorage();
}

// ── HELPERS ──────────────────────────────────────────────────
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function salvarStorage() { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }
function fmtData(d) {
  if (!d) return '';
  const [y, m, dia] = d.split('-');
  return `${dia}/${m}/${y}`;
}

// ── DATA ─────────────────────────────────────────────────────
function hojeStr() {
  return new Date().toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}

document.getElementById('hoje').textContent = hojeStr();

function atualizarStats() {
  const total = items.length;
  const pend  = items.filter(i => i.status === 'pendente').length;
  const and   = items.filter(i => i.status === 'andamento').length;
  const conc  = items.filter(i => i.status === 'concluido').length;
  document.getElementById('st-total').textContent = total;
  document.getElementById('st-pend').textContent  = pend;
  document.getElementById('st-and').textContent   = and;
  document.getElementById('st-conc').textContent  = conc;
  const pct = total ? Math.round((conc / total) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent  = pct + '%';
}

// ── RENDER ────────────────────────────────────────────────────
function renderLista() {
  const busca = document.getElementById('searchInput').value.toLowerCase();
  let lista = [...items];

  if (filtroAtivo !== 'todos') lista = lista.filter(i => i.status === filtroAtivo);
  if (busca) lista = lista.filter(i =>
    i.titulo.toLowerCase().includes(busca) ||
    (i.desc||'').toLowerCase().includes(busca) ||
    (i.categoria||'').toLowerCase().includes(busca) ||
    (i.responsavel||'').toLowerCase().includes(busca)
  );

  // Sort: concluido at bottom
  lista.sort((a,b) => {
    const order = { pendente:0, bloqueado:1, andamento:2, concluido:3 };
    return (order[a.status]||0) - (order[b.status]||0);
  });

  const el = document.getElementById('lista');

  if (lista.length === 0) {
    el.innerHTML = `<div class="empty"><strong>Nenhuma pendência aqui</strong>Adicione sua primeira pendência clicando em "+ Nova Pendência".</div>`;
    return;
  }

  el.innerHTML = lista.map(item => {
    const badgeClass = `badge badge-${item.status}`;
    const labels = { pendente:'Pendente', andamento:'Em andamento', concluido:'Concluído', bloqueado:'Bloqueado' };
    const updates = item.updates || [];
    const showAll = item._showAll;
    const visibleUpdates = showAll ? updates : updates.slice(-2);

    const updatesHTML = updates.length ? `
      <div class="updates-list">
        ${visibleUpdates.map(u => `<div class="update-entry"><span class="u-date">${fmtData(u.data)}</span>${u.texto}</div>`).join('')}
      </div>
      ${updates.length > 2 ? `<button class="toggle-updates" onclick="toggleUpdates('${item.id}')">${showAll ? '▲ Mostrar menos' : `▼ Ver todas as ${updates.length} atualizações`}</button>` : ''}
    ` : '';

    return `
    <div class="item" id="item-${item.id}">
      <div class="item-left">
        <div class="item-top">
          <div class="item-titulo ${item.status==='concluido'?'done':''}">${item.titulo}</div>
          <span class="${badgeClass}">${labels[item.status]}</span>
          ${item.categoria ? `<span class="badge-cat">${item.categoria}</span>` : ''}
        </div>
        ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ''}
        <div class="item-meta">
          ${item.responsavel ? `<span class="meta-info">👤 Resp: <span>${item.responsavel}</span></span>` : ''}
          ${item.previsao ? `<span class="meta-info">📅 Previsão: <span>${fmtData(item.previsao)}</span></span>` : ''}
          <span class="meta-info">📌 Criado: <span>${fmtData(item.criadoEm)}</span></span>
        </div>
        ${updatesHTML}
      </div>
      <div class="item-right">
        <button class="action-btn" onclick="abrirUpdate('${item.id}')" title="Adicionar atualização">📝</button>
        <button class="action-btn" onclick="editarItem('${item.id}')" title="Editar">✏️</button>
        <button class="action-btn danger" onclick="deletarItem('${item.id}')" title="Excluir">🗑</button>
      </div>
    </div>`;
  }).join('');
}

function toggleUpdates(id) {
  const item = items.find(i => i.id === id);
  if (item) { item._showAll = !item._showAll; renderLista(); }
}

// ── FILTROS ───────────────────────────────────────────────────
function setFiltro(btn, f) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filtroAtivo = f;
  renderLista();
}

// ── MODAL NOVA/EDITAR ─────────────────────────────────────────
function abrirModal(id = null) {
  editandoId = id;
  const item = id ? items.find(i => i.id === id) : null;
  document.getElementById('modalTitulo').textContent = id ? 'Editar Pendência' : 'Nova Pendência';
  document.getElementById('fTitulo').value   = item?.titulo    || '';
  document.getElementById('fDesc').value     = item?.desc      || '';
  document.getElementById('fStatus').value   = item?.status    || 'pendente';
  document.getElementById('fCat').value      = item?.categoria || '';
  document.getElementById('fResp').value     = item?.responsavel || '';
  document.getElementById('fPrevisao').value = item?.previsao  || '';
  document.getElementById('modalBg').classList.add('open');
  setTimeout(() => document.getElementById('fTitulo').focus(), 100);
}

function fecharModal() {
  document.getElementById('modalBg').classList.remove('open');
  editandoId = null;
}

function editarItem(id) { abrirModal(id); }

function salvar() {
  const titulo = document.getElementById('fTitulo').value.trim();
  if (!titulo) { document.getElementById('fTitulo').style.borderColor='var(--danger)'; return; }
  document.getElementById('fTitulo').style.borderColor='';

  const hoje = new Date().toISOString().split('T')[0];

  if (editandoId) {
    const idx = items.findIndex(i => i.id === editandoId);
    const oldStatus = items[idx].status;
    items[idx].titulo     = titulo;
    items[idx].desc       = document.getElementById('fDesc').value.trim();
    items[idx].status     = document.getElementById('fStatus').value;
    items[idx].categoria  = document.getElementById('fCat').value.trim();
    items[idx].responsavel= document.getElementById('fResp').value.trim();
    items[idx].previsao   = document.getElementById('fPrevisao').value;
    if (oldStatus !== items[idx].status) {
      const labels = { pendente:'Pendente', andamento:'Em andamento', concluido:'Concluído', bloqueado:'Bloqueado' };
      items[idx].updates = items[idx].updates || [];
      items[idx].updates.push({ data: hoje, texto: `Status alterado para: ${labels[items[idx].status]}` });
    }
  } else {
    items.unshift({
      id: uid(),
      titulo, 
      desc: document.getElementById('fDesc').value.trim(),
      status: document.getElementById('fStatus').value,
      categoria: document.getElementById('fCat').value.trim(),
      responsavel: document.getElementById('fResp').value.trim(),
      previsao: document.getElementById('fPrevisao').value,
      criadoEm: hoje,
      updates: []
    });
  }

  salvarStorage();
  fecharModal();
  atualizarStats();
  renderLista();
}

function deletarItem(id) {
  if (!confirm('Tem certeza que deseja excluir esta pendência?')) return;
  items = items.filter(i => i.id !== id);
  salvarStorage();
  atualizarStats();
  renderLista();
}

// ── MODAL ATUALIZAÇÃO ─────────────────────────────────────────
function abrirUpdate(id) {
  updateTargetId = id;
  document.getElementById('fUpdate').value = '';
  document.getElementById('fUpdateStatus').value = '';
  document.getElementById('updateModalBg').classList.add('open');
  setTimeout(() => document.getElementById('fUpdate').focus(), 100);
}

function fecharUpdateModal() {
  document.getElementById('updateModalBg').classList.remove('open');
  updateTargetId = null;
}

function salvarUpdate() {
  const texto = document.getElementById('fUpdate').value.trim();
  if (!texto) return;
  const novoStatus = document.getElementById('fUpdateStatus').value;
  const hoje = new Date().toISOString().split('T')[0];
  const idx = items.findIndex(i => i.id === updateTargetId);
  if (idx === -1) return;
  items[idx].updates = items[idx].updates || [];
  items[idx].updates.push({ data: hoje, texto });
  if (novoStatus) items[idx].status = novoStatus;
  salvarStorage();
  fecharUpdateModal();
  atualizarStats();
  renderLista();
}

// ── KEYBOARD ──────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { fecharModal(); fecharUpdateModal(); }
});

document.getElementById('modalBg').addEventListener('click', e => {
  if (e.target === document.getElementById('modalBg')) fecharModal();
});

document.getElementById('updateModalBg').addEventListener('click', e => {
  if (e.target === document.getElementById('updateModalBg')) fecharUpdateModal();
});

// ── EXPORTAR EXCEL ────────────────────────────────────────────
function exportarExcel() {
  const labels = { pendente:'Pendente', andamento:'Em andamento', concluido:'Concluído', bloqueado:'Bloqueado' };

  // Aba 1 — Resumo das pendências
  const resumo = items.map(item => ({
    'Título':        item.titulo,
    'Status':        labels[item.status] || item.status,
    'Categoria':     item.categoria || '',
    'Responsável':   item.responsavel || '',
    'Previsão':      item.previsao ? fmtData(item.previsao) : '',
    'Criado em':     fmtData(item.criadoEm),
    'Descrição':     item.desc || '',
    'Qtd. atualizações': (item.updates || []).length
  }));

  // Aba 2 — Histórico de atualizações
  const historico = [];
  items.forEach(item => {
    (item.updates || []).forEach(u => {
      historico.push({
        'Pendência':   item.titulo,
        'Status atual': labels[item.status] || item.status,
        'Data':        fmtData(u.data),
        'Atualização': u.texto
      });
    });
  });

  // Aba 3 — Resumo por status
  const porStatus = [
    { 'Status': 'Pendente',      'Quantidade': items.filter(i => i.status === 'pendente').length },
    { 'Status': 'Em andamento',  'Quantidade': items.filter(i => i.status === 'andamento').length },
    { 'Status': 'Bloqueado',     'Quantidade': items.filter(i => i.status === 'bloqueado').length },
    { 'Status': 'Concluído',     'Quantidade': items.filter(i => i.status === 'concluido').length },
    { 'Status': 'TOTAL',         'Quantidade': items.length }
  ];

  const wb = XLSX.utils.book_new();

  const ws1 = XLSX.utils.json_to_sheet(resumo);
  estilizarColunas(ws1, resumo);
  XLSX.utils.book_append_sheet(wb, ws1, 'Pendências');

  const ws2 = XLSX.utils.json_to_sheet(historico.length ? historico : [{ 'Info': 'Nenhuma atualização registrada ainda.' }]);
  XLSX.utils.book_append_sheet(wb, ws2, 'Histórico');

  const ws3 = XLSX.utils.json_to_sheet(porStatus);
  XLSX.utils.book_append_sheet(wb, ws3, 'Resumo');

  const dataHoje = new Date().toISOString().split('T')[0];
  XLSX.writeFile(wb, `diario-implantacao-${dataHoje}.xlsx`);
}

function estilizarColunas(ws, data) {
  if (!data.length) return;
  const cols = Object.keys(data[0]);
  ws['!cols'] = cols.map(c => ({ wch: Math.max(c.length, 18) }));
}

// ── INIT ──────────────────────────────────────────────────────
atualizarStats();
renderLista();
</script>
